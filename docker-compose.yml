version: '3.8'

services:
  movielite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movielite
    ports:
      - "8001:8001"
    volumes:
      # Movies directory for scanning
      - ./movies:/movies
      # Configuration and database
      - ./data:/data
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8001/api/user", "--no-check-certificate"]
      interval: 30s
      timeout: 10s
      retries: 3
