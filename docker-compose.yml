version: '3.8'

services:
  movielite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movielite
    ports:
      - "8001:8001"
    volumes:
      - ./movies:/movies:rw
      - ./data:/data:rw
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:password", "http://localhost:8001/api/user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
